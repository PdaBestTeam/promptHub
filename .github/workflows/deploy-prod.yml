name: Deploy to Production (Blue/Green)

on:
  push:
    branches:
      - prod

env:
  REGISTRY: ghcr.io
  EC2_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/deploy
  APP_DIR: /home/ubuntu/app

jobs:
  deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}/prompthub" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Upload bg-deploy.sh to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/bg-deploy.sh
          target: ${{ env.DEPLOY_DIR }}

          strip_components: 1

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          command_timeout: 300s
          script: |
            set -euo pipefail

            # ── .env.production 생성 ──────────────────────────────────────
            mkdir -p ${{ env.APP_DIR }}
            # GitHub Secret(ENV_PRODUCTION)의 멀티라인 내용을 파일로 기록
            cat > ${{ env.APP_DIR }}/.env.production <<'ENVEOF'
            ${{ secrets.ENV_PRODUCTION }}
            ENVEOF
            chmod 600 ${{ env.APP_DIR }}/.env.production
            echo "[INFO] .env.production 생성 완료"

            # ── GHCR 로그인 (EC2에서 pull 권한 필요) ───────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── 이미지 pull ────────────────────────────────────────────────
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            docker pull "$IMAGE"
            echo "[INFO] 이미지 pull 완료: $IMAGE"

            # ── bg-deploy.sh 실행 권한 부여 및 실행 ────────────────────────
            chmod +x ${{ env.DEPLOY_DIR }}/bg-deploy.sh
            ${{ env.DEPLOY_DIR }}/bg-deploy.sh "$IMAGE"

            # ── 사용하지 않는 이미지 정리 (선택) ──────────────────────────
            docker image prune -f || true
